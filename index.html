<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JustView — Twitch Multiview</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9147ff">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JustView">
<style>
  :root {
    --bg: #0e0e10;
    --panel: #18181b;
    --panel2: #1f1f23;
    --border: #2a2a2e;
    --purple: #9147ff;
    --purple-dim: #772ce8;
    --text: #efeff1;
    --muted: #adadb8;
    --gap: 8px;
    --sidebar-w: 260px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top bar */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .brand .dot { color: var(--purple); }
  .hamburger {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    flex: none;
  }
  .hamburger:hover { background: var(--panel2); }
  form.add {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 220px;
    max-width: 520px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--purple); }
  button {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  button:hover { background: var(--purple-dim); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 500;
  }
  button.ghost:hover { background: var(--panel2); color: var(--text); }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .count { color: var(--muted); font-size: 13px; white-space: nowrap; }

  /* Main = sidebar + grid */
  .main { flex: 1; display: flex; min-height: 0; }

  /* Sidebar */
  #sidebar {
    width: 0;
    overflow: hidden;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width .18s ease;
    flex: none;
  }
  body.sb-open #sidebar { width: var(--sidebar-w); }
  .sb-head {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: var(--sidebar-w);
  }
  .sb-title { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .sb-user { display: flex; align-items: center; gap: 8px; }
  .sb-user img { width: 34px; height: 34px; border-radius: 50%; background: var(--panel2); }
  .sb-user .u-name { font-weight: 700; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-actions { display: flex; gap: 6px; }
  .sb-actions button { flex: 1; padding: 7px 8px; font-size: 12px; }
  .sb-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .sb-note code { background: var(--panel2); color: var(--purple); padding: 1px 5px; border-radius: 4px; }
  .sb-list { flex: 1; overflow-y: auto; min-width: var(--sidebar-w); }
  .sb-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 12px;
    width: 100%;
    border: 0;
    background: none;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    border-radius: 0;
  }
  .sb-row:hover { background: var(--panel2); }
  .sb-row img { width: 30px; height: 30px; border-radius: 50%; background: var(--panel2); flex: none; }
  .sb-row .r-main { flex: 1; min-width: 0; }
  .sb-row .r-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-row .r-sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-row .r-live { color: #eb0400; font-weight: 700; }
  .sb-row.added { background: rgba(145,71,255,.12); }
  .sb-row .r-plus { color: var(--muted); font-size: 15px; flex: none; }
  .sb-row.added .r-plus { color: var(--purple); }
  .sb-empty { padding: 16px 12px; color: var(--muted); font-size: 13px; min-width: var(--sidebar-w); }

  /* Grid */
  #grid {
    flex: 1;
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    overflow: auto;
    grid-auto-rows: 1fr;
  }
  #grid.empty { display: flex; align-items: center; justify-content: center; }
  .placeholder { text-align: center; color: var(--muted); max-width: 420px; line-height: 1.6; }
  .placeholder h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
  .placeholder code { background: var(--panel2); padding: 2px 6px; border-radius: 4px; color: var(--purple); }

  /* Tile */
  .tile {
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    min-height: 0;
    min-width: 0;
  }
  .video-wrap { flex: 1; position: relative; min-width: 0; }
  .tile iframe { width: 100%; height: 100%; border: 0; display: block; }
  .tile:fullscreen, .tile:-webkit-full-screen { border: 0; border-radius: 0; }
  .chat-wrap { width: 300px; border-left: 1px solid var(--border); display: none; }
  .tile.chat-on .chat-wrap { display: block; }

  .tile-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,0));
    opacity: 0;
    transition: opacity .15s;
    z-index: 5;
    pointer-events: none;
  }
  .tile:hover .tile-bar { opacity: 1; pointer-events: auto; }
  .tile-name { font-weight: 700; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.8); margin-right: auto; }
  .tile-bar .icon {
    background: rgba(0,0,0,.55);
    border: none;
    color: #fff;
    width: 30px; height: 28px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
  }
  .tile-bar .icon:hover { background: var(--purple); }
  .tile-bar .icon.active { background: var(--purple); }
</style>
</head>
<body class="sb-open">
  <header>
    <button class="hamburger" id="sbToggle" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
    <div class="brand"><span class="dot">◧</span> JustView</div>
    <form class="add" id="addForm">
      <input type="text" id="channelInput" placeholder="Add a Twitch channel (e.g. imaqua67)" autocomplete="off" spellcheck="false">
      <button type="submit">Add</button>
    </form>
    <div class="toolbar">
      <span class="count" id="count">0 streams</span>
      <button id="installBtn" title="Install JustView as an app" style="display:none">Install</button>
      <button class="ghost" id="copyBtn" title="Copy shareable link">Share</button>
      <button class="ghost" id="clearBtn" title="Remove all">Clear</button>
    </div>
  </header>

  <div class="main">
    <aside id="sidebar">
      <div class="sb-head" id="sbHead"><!-- filled by JS --></div>
      <div class="sb-list" id="sbList"><!-- filled by JS --></div>
    </aside>
    <div id="grid" class="empty"></div>
  </div>

<script>
(function () {
  var CLIENT_ID = "xdvglzklefaxjrxge91afg0m9z2p7k";

  var SCOPES = "user:read:follows";
  var REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");
  if (!/\/$/.test(REDIRECT)) REDIRECT += "/";

  var LS_CHANNELS = "jv_channels";
  var LS_TOKEN = "jv_token";
  var LS_SIDEBAR = "jv_sidebar";

  var channels = [];     
  var token = null;      
  var me = null;         
  var follows = [];      

  var grid = document.getElementById("grid");
  var input = document.getElementById("channelInput");
  var countEl = document.getElementById("count");
  var sbHead = document.getElementById("sbHead");
  var sbList = document.getElementById("sbList");

  // ---------- helpers ----------
  function clean(s) {
    return (s || "").trim().toLowerCase().replace(/^@/, "").replace(/[^a-z0-9_]/g, "");
  }
  function dedupe(arr) {
    var seen = {}, out = [];
    arr.forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; out.push(x); } });
    return out;
  }
  var PARENT = location.hostname || "localhost";

  // ---------- state persistence (grid survives reloads) ----------
  function saveState() {
    try { localStorage.setItem(LS_CHANNELS, JSON.stringify(channels)); } catch (e) {}
    var p = new URLSearchParams();
    if (channels.length) p.set("c", channels.join(","));
    var q = p.toString();
    history.replaceState(null, "", q ? "?" + q : location.pathname);
  }
  function loadState() {
    var p = new URLSearchParams(location.search);
    var c = p.get("c");
    if (c) {
      channels = c.split(",").map(clean).filter(Boolean);
    } else {
      try {
        var s = JSON.parse(localStorage.getItem(LS_CHANNELS) || "[]");
        if (Array.isArray(s)) channels = s.map(clean).filter(Boolean);
      } catch (e) {}
    }
    channels = dedupe(channels);
  }

  // ---------- grid ----------
  function columnsFor(n) {
    if (n <= 1) return 1;
    if (n <= 4) return 2;
    if (n <= 9) return 3;
    if (n <= 16) return 4;
    return Math.ceil(Math.sqrt(n));
  }

  function render() {
    if (channels.length === 0) {
      grid.className = "empty";
      grid.style.gridTemplateColumns = "";
      grid.innerHTML =
        '<div class="placeholder"><h2>No streams yet</h2>' +
        'Add a channel above, or open the sidebar (☰) and pick from who you follow. ' +
        'Hit each stream’s ▶ to play, and use its ⛶ button to go fullscreen.</div>';
      updateCount();
      renderSidebar();
      return;
    }
    grid.className = "";
    grid.style.gridTemplateColumns = "repeat(" + columnsFor(channels.length) + ", 1fr)";
    grid.innerHTML = "";
    channels.forEach(function (ch) { grid.appendChild(makeTile(ch)); });
    updateCount();
    renderSidebar();
  }

  function makeTile(ch) {
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.ch = ch;

    var vwrap = document.createElement("div");
    vwrap.className = "video-wrap";
    var vf = document.createElement("iframe");
    vf.src = "https://player.twitch.tv/?channel=" + encodeURIComponent(ch) +
             "&parent=" + encodeURIComponent(PARENT) + "&muted=true&autoplay=true";
    vf.allowFullscreen = true;
    vf.setAttribute("allow", "autoplay; fullscreen");
    vwrap.appendChild(vf);
    tile.appendChild(vwrap);

    var cwrap = document.createElement("div");
    cwrap.className = "chat-wrap";
    tile.appendChild(cwrap);

    var bar = document.createElement("div");
    bar.className = "tile-bar";
    var name = document.createElement("span");
    name.className = "tile-name";
    name.textContent = ch;
    bar.appendChild(name);

    var fsBtn = iconBtn("⛶", "Fullscreen (Esc to exit)");
    fsBtn.addEventListener("click", function () {
      if (isFullscreen(tile)) exitFullscreen(); else requestFullscreen(tile);
    });
    bar.appendChild(fsBtn);

    var chatBtn = iconBtn("💬", "Toggle chat");
    chatBtn.addEventListener("click", function () {
      var on = tile.classList.toggle("chat-on");
      chatBtn.classList.toggle("active", on);
      if (on && !cwrap.dataset.loaded) {
        var cf = document.createElement("iframe");
        cf.src = "https://www.twitch.tv/embed/" + encodeURIComponent(ch) +
                 "/chat?parent=" + encodeURIComponent(PARENT) + "&darkpopout";
        cf.style.width = "100%"; cf.style.height = "100%"; cf.style.border = "0";
        cwrap.appendChild(cf);
        cwrap.dataset.loaded = "1";
      }
    });
    bar.appendChild(chatBtn);

    var closeBtn = iconBtn("✕", "Remove");
    closeBtn.addEventListener("click", function () { removeChannel(ch); });
    bar.appendChild(closeBtn);

    tile.appendChild(bar);
    return tile;
  }

  function iconBtn(label, title) {
    var b = document.createElement("button");
    b.className = "icon";
    b.textContent = label;
    b.title = title;
    b.type = "button";
    return b;
  }

  function isFullscreen(el) {
    return (document.fullscreenElement || document.webkitFullscreenElement) === el;
  }
  function requestFullscreen(el) {
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
  }
  function exitFullscreen() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (fn) { try { fn.call(document); } catch (e) {} }
  }

  function updateCount() {
    countEl.textContent = channels.length + (channels.length === 1 ? " stream" : " streams");
  }

  function addChannel(raw) {
    var ch = clean(raw);
    if (!ch || channels.indexOf(ch) !== -1) return;
    channels.push(ch);
    saveState(); render();
  }
  function removeChannel(ch) {
    channels = channels.filter(function (x) { return x !== ch; });
    saveState(); render();
  }
  function toggleChannel(ch) {
    if (channels.indexOf(ch) === -1) addChannel(ch); else removeChannel(ch);
  }

  // ---------- Twitch OAuth (browser-only implicit flow) ----------
  function login() {
    if (!CLIENT_ID) { alert("No Twitch Client ID set yet. Paste it near the top of index.html."); return; }
    var u = "https://id.twitch.tv/oauth2/authorize?client_id=" + encodeURIComponent(CLIENT_ID) +
            "&redirect_uri=" + encodeURIComponent(REDIRECT) +
            "&response_type=token&scope=" + encodeURIComponent(SCOPES);
    location.href = u;
  }
  function logout() {
    token = null; me = null; follows = [];
    try { localStorage.removeItem(LS_TOKEN); } catch (e) {}
    renderSidebar();
  }
  function captureToken() {
    var frag = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    var query = new URLSearchParams(location.search || "");
    // Twitch sends errors back as ?error=... or #error=...
    var err = frag.get("error") || query.get("error");
    if (err) {
      var desc = (frag.get("error_description") || query.get("error_description") || "").replace(/\+/g, " ");
      alert("Twitch login failed:\n" + err + (desc ? "\n\n" + desc : "") +
            "\n\nRedirect this app used:\n" + REDIRECT +
            "\n\nMake sure that exact URL is in your Twitch app's OAuth Redirect URLs.");
      history.replaceState(null, "", location.pathname + location.search.replace(/[?&]error[^&]*/g, ""));
      return;
    }
    var t = frag.get("access_token");
    if (t) {
      token = t;
      try { localStorage.setItem(LS_TOKEN, t); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search); // strip token from URL
    } else {
      try { token = localStorage.getItem(LS_TOKEN) || null; } catch (e) {}
    }
  }

  function tw(path) {
    return fetch("https://api.twitch.tv/helix/" + path, {
      headers: { "Client-Id": CLIENT_ID, "Authorization": "Bearer " + token }
    }).then(function (r) {
      if (r.status === 401) { logout(); throw new Error("auth expired"); }
      return r.json();
    });
  }

  function batchGet(path, key, ids) {
    var chunks = [];
    for (var i = 0; i < ids.length; i += 100) chunks.push(ids.slice(i, i + 100));
    return Promise.all(chunks.map(function (c) {
      var q = c.map(function (id) { return key + "=" + encodeURIComponent(id); }).join("&");
      return tw(path + "?" + q).then(function (d) { return d.data || []; });
    })).then(function (res) { return [].concat.apply([], res); });
  }

  function loadFollowsPaged(userId, all, cursor) {
    all = all || [];
    var url = "channels/followed?user_id=" + userId + "&first=100" + (cursor ? "&after=" + cursor : "");
    return tw(url).then(function (d) {
      all = all.concat(d.data || []);
      if (d.pagination && d.pagination.cursor && (d.data || []).length) {
        return loadFollowsPaged(userId, all, d.pagination.cursor);
      }
      return all;
    });
  }

  function loadTwitch() {
    if (!token || !CLIENT_ID) return;
    tw("users").then(function (d) {
      me = (d.data && d.data[0]) || null;
      renderSidebar();
      if (!me) return;
      return loadFollowsPaged(me.id).then(function (raw) {
        follows = raw.map(function (x) {
          return { login: x.broadcaster_login, name: x.broadcaster_name, id: x.broadcaster_id,
                   live: false, viewers: 0, avatar: "" };
        });
        renderSidebar();
        enrich(follows);
      });
    }).catch(function (e) {
      if (e && e.message !== "auth expired") {
        console.error("JustView Twitch load error:", e);
      }
    });
  }

  function enrich(list) {
    if (!list.length) return;
    var ids = list.map(function (x) { return x.id; });
    batchGet("streams", "user_id", ids).then(function (streams) {
      var m = {};
      streams.forEach(function (s) { m[s.user_id] = s.viewer_count; });
      list.forEach(function (x) { if (x.id in m) { x.live = true; x.viewers = m[x.id]; } });
      renderSidebar();
    }).catch(function () {});
    batchGet("users", "id", ids).then(function (users) {
      var a = {};
      users.forEach(function (u) { a[u.id] = u.profile_image_url; });
      list.forEach(function (x) { x.avatar = a[x.id] || ""; });
      renderSidebar();
    }).catch(function () {});
  }

  // ---------- sidebar rendering ----------
  function fmtViewers(n) {
    if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "K";
    return String(n);
  }

  function renderSidebar() {
    // header
    sbHead.innerHTML = "";
    var title = document.createElement("div");
    title.className = "sb-title";
    title.textContent = "Following";
    sbHead.appendChild(title);

    if (!CLIENT_ID) {
      var note = document.createElement("div");
      note.className = "sb-note";
      note.innerHTML = "Twitch login isn’t set up yet. Paste your <code>Client ID</code> near the top of <code>index.html</code> to enable your followed-channels list.";
      sbHead.appendChild(note);
    } else if (!token || !me) {
      var connect = document.createElement("button");
      connect.textContent = "Connect Twitch";
      connect.addEventListener("click", login);
      sbHead.appendChild(connect);
    } else {
      var user = document.createElement("div");
      user.className = "sb-user";
      var img = document.createElement("img");
      img.src = me.profile_image_url || "icon-192.png";
      img.alt = "";
      var nm = document.createElement("div");
      nm.className = "u-name";
      nm.textContent = me.display_name || me.login;
      user.appendChild(img); user.appendChild(nm);
      sbHead.appendChild(user);

      var actions = document.createElement("div");
      actions.className = "sb-actions";
      var refresh = document.createElement("button");
      refresh.className = "ghost"; refresh.textContent = "Refresh";
      refresh.addEventListener("click", function () { loadTwitch(); });
      var out = document.createElement("button");
      out.className = "ghost"; out.textContent = "Log out";
      out.addEventListener("click", logout);
      actions.appendChild(refresh); actions.appendChild(out);
      sbHead.appendChild(actions);
    }

    // list
    sbList.innerHTML = "";
    if (!token || !me) {
      if (CLIENT_ID) {
        var e = document.createElement("div");
        e.className = "sb-empty";
        e.textContent = "Connect your Twitch account to see who you follow here.";
        sbList.appendChild(e);
      }
      return;
    }
    if (!follows.length) {
      var e2 = document.createElement("div");
      e2.className = "sb-empty";
      e2.textContent = "Loading your follows…";
      sbList.appendChild(e2);
      return;
    }

    // live first (by viewers), then offline A–Z
    var sorted = follows.slice().sort(function (a, b) {
      if (a.live !== b.live) return a.live ? -1 : 1;
      if (a.live && b.live) return b.viewers - a.viewers;
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
    });

    sorted.forEach(function (f) {
      var inGrid = channels.indexOf(f.login) !== -1;
      var row = document.createElement("button");
      row.className = "sb-row" + (inGrid ? " added" : "");
      row.title = inGrid ? "Remove from grid" : "Add to grid";

      var img = document.createElement("img");
      img.src = f.avatar || "icon-192.png";
      img.alt = "";
      row.appendChild(img);

      var main = document.createElement("div");
      main.className = "r-main";
      var rn = document.createElement("div");
      rn.className = "r-name";
      rn.textContent = f.name || f.login;
      var rs = document.createElement("div");
      rs.className = "r-sub";
      if (f.live) rs.innerHTML = '<span class="r-live">● LIVE</span> · ' + fmtViewers(f.viewers) + " viewers";
      else rs.textContent = "offline";
      main.appendChild(rn); main.appendChild(rs);
      row.appendChild(main);

      var plus = document.createElement("span");
      plus.className = "r-plus";
      plus.textContent = inGrid ? "✓" : "+";
      row.appendChild(plus);

      row.addEventListener("click", function () { toggleChannel(f.login); });
      sbList.appendChild(row);
    });
  }

  // ---------- sidebar open/close ----------
  function initSidebar() {
    var saved = null;
    try { saved = localStorage.getItem(LS_SIDEBAR); } catch (e) {}
    var open = saved === null ? (window.innerWidth > 760) : (saved === "1");
    document.body.classList.toggle("sb-open", open);
    document.getElementById("sbToggle").addEventListener("click", function () {
      var isOpen = document.body.classList.toggle("sb-open");
      try { localStorage.setItem(LS_SIDEBAR, isOpen ? "1" : "0"); } catch (e) {}
    });
  }

  // ---------- toolbar ----------
  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    input.value.split(/[,\s]+/).forEach(addChannel);
    input.value = "";
    input.focus();
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    channels = []; saveState(); render();
  });
  document.getElementById("copyBtn").addEventListener("click", function () {
    var url = location.href, btn = this;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () {
        var o = btn.textContent; btn.textContent = "Copied!";
        setTimeout(function () { btn.textContent = o; }, 1200);
      }, function () { prompt("Copy this link:", url); });
    } else { prompt("Copy this link:", url); }
  });

  // ---------- installable app (PWA) ----------
  var installBtn = document.getElementById("installBtn");
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferredPrompt = e;
    if (installBtn) installBtn.style.display = "inline-block";
  });
  if (installBtn) installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () {
      deferredPrompt = null; installBtn.style.display = "none";
    });
  });
  window.addEventListener("appinstalled", function () {
    if (installBtn) installBtn.style.display = "none";
  });

  // ---------- boot ----------
  initSidebar();
  captureToken();
  loadState();
  render();
  loadTwitch();
})();

// register the service worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
